services:
  - type: web
    name: cod2ship-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cod2ship-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_FORM_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: ENVIRONMENT
        value: "production"
      - key: CODE_EXECUTOR_URL
        sync: false
      - key: CODE_EXECUTOR_KEY
        sync: false

databases:
  - name: cod2ship-db
    plan: free
    databaseName: cod2ship
    postgresMajorVersion: "18"
